name: Deploy Wiki

on:
  push:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Checkout vault
        uses: actions/checkout@v6
        with:
          repository: marianoInsa/cerebro-digital
          token: ${{ secrets.VAULT_READ_TOKEN }}
          path: content
          fetch-depth: 0

      - run: npm ci
      - run: npx quartz plugin install --from-config
      - run: npx quartz build -d content

      # shortcut: PDFs/PPTX quedan fuera del sitio y sus enlaces dan 404.
      # Cuando importe, agregar redirects a GitHub o mover los archivos a R2.
      - name: Drop PDFs and PPTX
        run: find public -type f \( -iname '*.pdf' -o -iname '*.pptx' -o -iname '*.ppt' \) -delete

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.161.0"
          command: deploy
