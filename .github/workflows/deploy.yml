name: Deploy Wiki

on:
  push:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Checkout vault
        uses: actions/checkout@v6
        with:
          repository: marianoInsa/cerebro-digital
          token: ${{ secrets.VAULT_READ_TOKEN }}
          path: content
          fetch-depth: 0
          filter: blob:none

      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx quartz plugin install --from-config
      - run: npx quartz build -d content

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.161.0"
          command: deploy
